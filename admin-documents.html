<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document Management | UMV</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="bg-slate-50 text-slate-800"><header class="bg-slate-900 text-white p-5"><div class="max-w-5xl mx-auto flex justify-between"><div><div class="text-xs text-blue-300 font-bold">ADMIN CONTENT</div><h1 class="text-2xl font-black">📄 Document Management</h1></div><a href="admin-content.html" class="px-4 py-2 rounded-xl bg-white/10">← Content Centre</a></div></header><main class="max-w-5xl mx-auto p-4 py-8"><div class="mb-4 p-4 bg-amber-50 border border-amber-200 rounded-2xl text-sm">अभी यह metadata/draft form है। PDF को GitHub में upload नहीं किया जाएगा। वास्तविक file upload अगले Drive integration phase में होगा।</div><form id="f" class="bg-white border rounded-3xl p-6 grid md:grid-cols-2 gap-4"><label class="md:col-span-2 font-bold">Document Title<input name="title" required class="w-full mt-2 p-3 border rounded-xl"></label><label>Category<select name="category" class="w-full mt-2 p-3 border rounded-xl"><option>Official Document</option><option>Notice / Circular</option><option>Order</option><option>Rule / Regulation</option><option>Form</option><option>Archive</option></select></label><label>Department<input name="department" class="w-full mt-2 p-3 border rounded-xl" placeholder="BSEB / Education Department / DEO"></label><label>Related Portal<input name="portal" class="w-full mt-2 p-3 border rounded-xl"></label><label>Document Date<input name="date" type="date" class="w-full mt-2 p-3 border rounded-xl"></label><label>Notification / Order No.<input name="number" class="w-full mt-2 p-3 border rounded-xl"></label><label>Official Source URL<input name="source" type="url" class="w-full mt-2 p-3 border rounded-xl"></label><label>Google Drive File/Folder URL<input name="drive" type="url" class="w-full mt-2 p-3 border rounded-xl"></label><label>Visibility<select name="visibility" class="w-full mt-2 p-3 border rounded-xl"><option>Public</option><option>Admin Only</option><option>Private / Confidential</option></select></label><label>Archive Status<select name="archive" class="w-full mt-2 p-3 border rounded-xl"><option>Active</option><option>Archived</option></select></label><label class="md:col-span-2">Notes / Extracted Summary<textarea name="notes" rows="5" class="w-full mt-2 p-3 border rounded-xl" placeholder="Title, date, subject, important deadline, related guide..."></textarea></label><div class="md:col-span-2"><button class="bg-blue-700 text-white px-6 py-3 rounded-xl font-bold">Save Local Draft</button></div><div id="msg" class="md:col-span-2 text-sm"></div></form></main><script>const f=document.getElementById('f'),k='umv-admin-documents';const x=JSON.parse(localStorage.getItem(k)||'null');if(x)Object.entries(x).forEach(([a,b])=>{if(f.elements[a])f.elements[a].value=b});f.onsubmit=e=>{e.preventDefault();localStorage.setItem(k,JSON.stringify(Object.fromEntries(new FormData(f))));msg.textContent='✓ Document metadata draft सुरक्षित है; अभी कोई file upload/publish नहीं हुआ।';msg.className='md:col-span-2 p-3 rounded-xl bg-emerald-50 text-emerald-800'};</script></body></html>
