<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document Operations | UMV Tetahali</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50 text-slate-800"><header class="bg-slate-950 text-white"><div class="max-w-7xl mx-auto px-4 py-5"><div class="text-xs font-black tracking-widest text-blue-300">RESTRICTED ADMIN</div><h1 class="text-2xl font-black">📄 Document Operations</h1><p class="text-sm text-slate-400 mt-1">Reprocess, metadata correction, publication control और audit history</p></div></header><main class="max-w-7xl mx-auto p-4 space-y-5"><div id="auth" class="rounded-2xl border bg-white p-5">Checking admin session…</div><section id="app" class="hidden space-y-5"><div class="grid lg:grid-cols-[360px_1fr] gap-5"><aside class="bg-white border rounded-2xl p-4"><div class="flex gap-2"><input id="search" class="w-full border rounded-xl px-3 py-2" placeholder="Subject / filename / authority"><button id="refresh" class="border rounded-xl px-3 font-bold">↻</button></div><div id="docs" class="mt-4 space-y-2"></div></aside><section class="bg-white border rounded-2xl p-5"><div id="empty" class="text-center py-16 text-slate-500">किसी document को चुनें।</div><div id="detail" class="hidden"><div class="flex flex-wrap justify-between gap-3"><div><div id="status" class="text-xs font-black"></div><h2 id="title" class="text-xl font-black mt-1"></h2><p id="filename" class="text-xs text-slate-500 mt-1"></p></div><a id="open" target="_blank" class="px-3 py-2 rounded-xl bg-slate-900 text-white text-xs font-bold">Open file</a></div><div id="meta" class="grid md:grid-cols-2 gap-3 mt-5"></div><div class="mt-6 border-t pt-5"><h3 class="font-black">Operations</h3><div class="flex flex-wrap gap-2 mt-3"><button id="reprocess" class="px-3 py-2 rounded-xl bg-blue-700 text-white text-sm font-bold">↻ Reprocess</button><button id="unpublish" class="px-3 py-2 rounded-xl border text-sm font-bold">Unpublish</button><button id="restore" class="px-3 py-2 rounded-xl border text-sm font-bold">Restore publication</button></div><p class="text-xs text-slate-500 mt-2">Operations are audited. Destructive changes are not performed automatically.</p></div><div class="mt-6"><h3 class="font-black">Audit history</h3><div id="audit" class="mt-3 space-y-2"></div></div></div></section></div></section></main><script>const URL='https://sxfnrwugsyfypqgfglzc.supabase.co',KEY='sb_publishable_NARdPew6T6Zk8gYfxY3Hog_G7jcceKw',db=supabase.createClient(URL,KEY);let current=null,all=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){const{data,error}=await db.auth.getUser();if(error||!data.user){$('auth').innerHTML='<b>Admin login required.</b> <a class="text-blue-700" href="admin-login.html">Open login</a>';return}$('auth').innerHTML=`Signed in: <b>${esc(data.user.email||data.user.id)}</b>`;$('app').classList.remove('hidden');await load()}async function load(){const{data,error}=await db.from('documents').select('id,original_filename,display_filename,subject,issuing_authority,reference_number,normalized_issue_date,processing_status,publication_status,approved_for_publication,public_file_url,document_version,canonical_document_id,supersedes_document_id,updated_at,created_at').order('updated_at',{ascending:false}).limit(100);if(error){$('docs').innerHTML='<div class="text-red-700 text-sm">Documents unavailable. Admin RLS/RPC policy needs to permit this view.</div>';return}all=data||[];renderList()}function renderList(){const q=$('search').value.toLowerCase();const rows=all.filter(x=>[x.subject,x.original_filename,x.display_filename,x.issuing_authority,x.reference_number].join(' ').toLowerCase().includes(q));$('docs').innerHTML=rows.length?rows.map(x=>`<button class="w-full text-left border rounded-xl p-3 hover:bg-slate-50" data-id="${x.id}"><div class="font-bold text-sm">${esc(x.subject||x.display_filename||x.original_filename||'Untitled')}</div><div class="text-xs text-slate-500 mt-1">${esc(x.issuing_authority||'—')} · v${x.document_version||1}</div><div class="text-[10px] mt-1">${esc(x.processing_status)} / ${esc(x.publication_status)}</div></button>`).join(''):'<div class="text-sm text-slate-500 p-4">No documents found.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>select(b.dataset.id))}async function select(id){current=all.find(x=>x.id===id);if(!current)return;$('empty').classList.add('hidden');$('detail').classList.remove('hidden');$('title').textContent=current.subject||current.display_filename||current.original_filename||'Untitled';$('filename').textContent=`Original: ${current.original_filename||'—'} | Display: ${current.display_filename||'—'}`;$('status').textContent=`${current.processing_status} · ${current.publication_status} · v${current.document_version||1}`;$('open').href=current.public_file_url||'#';$('meta').innerHTML=[['Authority',current.issuing_authority],['Reference',current.reference_number],['Issue date',current.normalized_issue_date],['Canonical ID',current.canonical_document_id||current.id],['Supersedes',current.supersedes_document_id||'—'],['Updated',current.updated_at]].map(([a,b])=>`<div class="bg-slate-50 rounded-xl p-3"><div class="text-xs font-bold text-slate-500">${a}</div><div class="text-sm font-semibold mt-1">${esc(b||'—')}</div></div>`).join('');await audit()}async function audit(){const{data}=await db.from('document_operations_audit').select('operation,actor_type,from_status,to_status,details,created_at').eq('document_id',current.id).order('created_at',{ascending:false}).limit(50);$('audit').innerHTML=data?.length?data.map(x=>`<div class="border rounded-xl p-3"><div class="font-bold text-sm">${esc(x.operation)}</div><div class="text-xs text-slate-500">${esc(x.created_at)} · ${esc(x.actor_type)}</div><pre class="text-xs whitespace-pre-wrap mt-2">${esc(JSON.stringify(x.details||{},null,2))}</pre></div>`).join(''):'<div class="text-sm text-slate-500">No audit entries.</div>'}async function op(kind){if(!current)return;const reason=prompt(kind==='reprocess'?'Reprocess reason?':kind==='unpublish'?'Why unpublish?':'Restore reason?');if(!reason)return;let patch={};if(kind==='reprocess')patch={processing_status:'Queued',reprocess_requested_at:new Date().toISOString(),reprocess_reason:reason};if(kind==='unpublish')patch={publication_status:'Unpublished by Admin',approved_for_publication:false,unpublished_at:new Date().toISOString(),publication_reason:reason};if(kind==='restore')patch={publication_status:'Unpublished',approved_for_publication:false,publication_reason:`Restore requested: ${reason}`};const{data,error}=await db.from('documents').update(patch).eq('id',current.id).select().single();if(error){alert('Operation failed: '+error.message);return}await db.from('document_operations_audit').insert({document_id:current.id,operation:kind,actor_type:'admin_ui',from_status:{processing_status:current.processing_status,publication_status:current.publication_status},to_status:patch,details:{reason}});alert('Saved and audited.');await load();select(current.id)}$('search').oninput=renderList;$('refresh').onclick=load;$('reprocess').onclick=()=>op('reprocess');$('unpublish').onclick=()=>op('unpublish');$('restore').onclick=()=>op('restore');init();</script></body></html>
