<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>विद्यालय दस्तावेज़ अभिलेख | उच्च माध्यमिक विद्यालय, तेतहली</title>
  <meta name="description" content="विद्यालय के आधिकारिक पत्र, आदेश, परिपत्र एवं अन्य दस्तावेज़।">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="stylesheet" href="assets/document-archive.css?v=20260911-2">
</head>
<body>
  <main class="archive-page">
    <section class="panel" data-document-archive>
      <div class="datatable-top">
        <div class="entries-control">
          <span>Show</span>
          <select data-archive-role="page-size" aria-label="Entries per page">
            <option value="10" selected>10</option>
            <option value="25">25</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
          <span>entries</span>
        </div>
        <label class="search-control">Search here:
          <input data-archive-role="search" type="search" autocomplete="off" aria-label="Search documents">
        </label>
      </div>

      <div class="state" data-archive-role="status">सार्वजनिक दस्तावेज़ लोड हो रहे हैं…</div>

      <div class="table-wrap" data-archive-role="table-wrap" hidden>
        <table class="records">
          <thead>
            <tr>
              <th>Sr.No.</th>
              <th>Letter<br>Type</th>
              <th>Issuing<br>Authority</th>
              <th>Issued<br>Date</th>
              <th>Upload<br>Date</th>
              <th>Subject</th>
              <th>Download</th>
            </tr>
          </thead>
          <tbody data-archive-role="rows"></tbody>
        </table>
      </div>

      <div class="datatable-bottom">
        <span data-archive-role="count"></span>
        <div class="pager">
          <button data-archive-role="prev" type="button">Previous</button>
          <button data-archive-role="next" type="button">Next</button>
        </div>
      </div>
    </section>
  </main>
  <script src="assets/document-archive-config.js?v=20260911-2"></script>
  <script src="assets/document-archive.js?v=20260911-2"></script>
</body>
</html>
