<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archive | UMV Tetahali</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50 text-slate-800"><header class="bg-slate-900 text-white p-5"><div class="max-w-5xl mx-auto flex justify-between"><div><div class="text-xs text-blue-300 font-bold">ADMIN CONTENT</div><h1 class="text-2xl font-black">🗄️ Archive</h1></div><a href="admin-content.html" class="px-4 py-2 rounded-xl bg-white/10">← Content Centre</a></div></header><main class="max-w-5xl mx-auto p-4 py-8"><div class="bg-white border rounded-3xl p-6"><h2 class="font-black text-xl">Archived content register</h2><p class="text-sm text-slate-500 mt-2">यह Phase 1 register है। यहाँ पुराने session, notices, guides और historical PDFs के metadata रखे जा सकते हैं। वास्तविक archive storage Google Drive में रहेगा।</p><div class="grid md:grid-cols-3 gap-4 mt-6"><label>Type<select id="type" class="w-full mt-2 p-3 border rounded-xl"><option>Old Notice</option><option>Previous Session Guide</option><option>Historical PDF</option><option>Expired Portal</option></select></label><label>Title<input id="title" class="w-full mt-2 p-3 border rounded-xl"></label><label>Archive Date<input id="date" type="date" class="w-full mt-2 p-3 border rounded-xl"></label><label class="md:col-span-3">Drive URL<input id="drive" type="url" class="w-full mt-2 p-3 border rounded-xl"></label></div><button id="save" class="mt-5 bg-slate-900 text-white px-6 py-3 rounded-xl font-bold">Add to Local Archive Register</button><div id="msg" class="mt-4 text-sm"></div><div id="list" class="mt-6 space-y-2"></div></div></main><script>const k='umv-admin-archive';function render(){const a=JSON.parse(localStorage.getItem(k)||'[]');list.innerHTML=a.length?a.map((x,i)=>`<div class="border rounded-xl p-3 flex justify-between gap-3"><span><b>${x.title||'Untitled'}</b><br><small>${x.type} • ${x.date||'No date'}</small></span><button onclick="removeItem(${i})" class="text-rose-700 font-bold">Remove</button></div>`).join(''):'<div class="text-sm text-slate-400">अभी कोई local archive entry नहीं है।</div>'}function removeItem(i){const a=JSON.parse(localStorage.getItem(k)||'[]');a.splice(i,1);localStorage.setItem(k,JSON.stringify(a));render()}save.onclick=()=>{const a=JSON.parse(localStorage.getItem(k)||'[]');a.unshift({type:type.value,title:title.value,date:date.value,drive:drive.value});localStorage.setItem(k,JSON.stringify(a));msg.textContent='✓ Archive register updated locally.';render()};render();</script></body></html>
