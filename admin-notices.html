<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notice Management | UMV</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50 text-slate-800"><header class="bg-slate-900 text-white p-5"><div class="max-w-5xl mx-auto flex justify-between"><div><div class="text-xs text-blue-300 font-bold">ADMIN CONTENT</div><h1 class="text-2xl font-black">📢 Notice Management</h1></div><a href="admin-content.html" class="px-4 py-2 rounded-xl bg-white/10">← Content Centre</a></div></header><main class="max-w-5xl mx-auto p-4 py-8"><form id="f" class="bg-white border rounded-3xl p-6 grid md:grid-cols-2 gap-4"><label class="md:col-span-2 font-bold">Notice / Circular Title<input name="title" required class="w-full mt-2 p-3 border rounded-xl"></label><label>Date<input name="date" type="date" class="w-full mt-2 p-3 border rounded-xl"></label><label>Department / Issuing Office<input name="department" class="w-full mt-2 p-3 border rounded-xl"></label><label>Deadline<input name="deadline" type="date" class="w-full mt-2 p-3 border rounded-xl"></label><label>Related Portal<input name="portal" class="w-full mt-2 p-3 border rounded-xl"></label><label>Official PDF URL<input name="pdf" type="url" class="w-full mt-2 p-3 border rounded-xl"></label><label>Google Drive URL<input name="drive" type="url" class="w-full mt-2 p-3 border rounded-xl"></label><label>Status<select name="status" class="w-full mt-2 p-3 border rounded-xl"><option>Active</option><option>Important</option><option>Archive</option></select></label><label class="md:col-span-2">Summary / Action Required<textarea name="summary" rows="6" class="w-full mt-2 p-3 border rounded-xl" placeholder="क्या करना है, किसे करना है, कब तक करना है..."></textarea></label><button class="md:col-span-2 bg-blue-700 text-white px-6 py-3 rounded-xl font-bold">Save Local Draft</button><div id="msg" class="md:col-span-2 text-sm"></div></form></main><script>const f=document.getElementById('f'),k='umv-admin-notices';const x=JSON.parse(localStorage.getItem(k)||'null');if(x)Object.entries(x).forEach(([a,b])=>{if(f.elements[a])f.elements[a].value=b});f.onsubmit=e=>{e.preventDefault();localStorage.setItem(k,JSON.stringify(Object.fromEntries(new FormData(f))));msg.textContent='✓ Notice draft सुरक्षित है; publish अभी नहीं हुआ।';msg.className='md:col-span-2 p-3 rounded-xl bg-emerald-50 text-emerald-800'};</script></body></html>
