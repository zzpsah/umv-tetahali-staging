<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal Management | UMV</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="bg-slate-50 text-slate-800"><header class="bg-slate-900 text-white p-5"><div class="max-w-5xl mx-auto flex justify-between"><div><div class="text-xs text-blue-300 font-bold">ADMIN CONTENT</div><h1 class="text-2xl font-black">🌐 Portal Management</h1></div><a href="admin-content.html" class="px-4 py-2 rounded-xl bg-white/10">← Content Centre</a></div></header><main class="max-w-5xl mx-auto p-4 py-8"><form id="f" class="bg-white border rounded-3xl p-6 grid md:grid-cols-2 gap-4"><label class="md:col-span-2 font-bold">Portal Name<input name="name" required class="w-full mt-2 p-3 border rounded-xl" placeholder="e-Shikshakosh Bihar"></label><label>Home URL<input name="home" type="url" class="w-full mt-2 p-3 border rounded-xl" placeholder="https://..."></label><label>Login URL<input name="login" type="url" class="w-full mt-2 p-3 border rounded-xl"></label><label>Registration URL<input name="registration" type="url" class="w-full mt-2 p-3 border rounded-xl"></label><label>Current Session<input name="session" class="w-full mt-2 p-3 border rounded-xl" placeholder="2026–27"></label><label>Start Date<input name="start" type="date" class="w-full mt-2 p-3 border rounded-xl"></label><label>Last Date<input name="end" type="date" class="w-full mt-2 p-3 border rounded-xl"></label><label>Official Source URL<input name="source" type="url" class="w-full mt-2 p-3 border rounded-xl"></label><label>Last Verified<input name="verified" type="date" class="w-full mt-2 p-3 border rounded-xl"></label><label>Status<select name="status" class="w-full mt-2 p-3 border rounded-xl"><option>Draft</option><option>Verified</option><option>Review Required</option><option>Archived</option></select></label><label class="md:col-span-2">Guide Steps<textarea name="steps" rows="6" class="w-full mt-2 p-3 border rounded-xl" placeholder="1. Login...&#10;2. Open...&#10;3. Submit..."></textarea></label><label class="md:col-span-2">Official PDF / Resource URLs<textarea name="resources" rows="4" class="w-full mt-2 p-3 border rounded-xl"></textarea></label><div class="md:col-span-2 flex gap-3"><button class="bg-blue-700 text-white px-6 py-3 rounded-xl font-bold">Save Local Draft</button><button type="button" id="clear" class="border px-6 py-3 rounded-xl font-bold">Clear</button></div><div id="msg" class="md:col-span-2 text-sm"></div></form></main><script>const k='umv-admin-portals';const f=document.getElementById('f');const saved=JSON.parse(localStorage.getItem(k)||'null');if(saved)Object.entries(saved).forEach(([x,v])=>{if(f.elements[x])f.elements[x].value=v});f.onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(f));localStorage.setItem(k,JSON.stringify(o));msg.textContent='✓ Draft browser में सुरक्षित है। Database/website अभी publish नहीं हुआ।';msg.className='md:col-span-2 mt-2 p-3 rounded-xl bg-emerald-50 text-emerald-800'};clear.onclick=()=>{f.reset();localStorage.removeItem(k);msg.textContent='Draft साफ कर दिया गया।'};</script></body></html>
