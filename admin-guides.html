<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal Guide Editor | UMV</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50 text-slate-800"><header class="bg-slate-900 text-white p-5"><div class="max-w-5xl mx-auto flex justify-between"><div><div class="text-xs text-blue-300 font-bold">ADMIN CONTENT</div><h1 class="text-2xl font-black">📘 Portal Guide Editor</h1></div><a href="admin-content.html" class="px-4 py-2 rounded-xl bg-white/10">← Content Centre</a></div></header><main class="max-w-5xl mx-auto p-4 py-8"><form id="f" class="bg-white border rounded-3xl p-6 grid gap-4"><label class="font-bold">Portal / Guide Name<input name="name" required class="w-full mt-2 p-3 border rounded-xl"></label><label>Purpose<textarea name="purpose" rows="3" class="w-full mt-2 p-3 border rounded-xl"></textarea></label><label>Who is it for?<textarea name="audience" rows="2" class="w-full mt-2 p-3 border rounded-xl"></textarea></label><label>Registration / Login Procedure<textarea name="login" rows="4" class="w-full mt-2 p-3 border rounded-xl"></textarea></label><label>Step-by-step Procedure<textarea name="steps" rows="8" class="w-full mt-2 p-3 border rounded-xl" placeholder="1. Portal खोलें...&#10;2. Login...&#10;3. Form भरें..."></textarea></label><label>Required Documents<textarea name="docs" rows="4" class="w-full mt-2 p-3 border rounded-xl"></textarea></label><label>Precautions<textarea name="precautions" rows="4" class="w-full mt-2 p-3 border rounded-xl"></textarea></label><label>Official PDFs / Resources<textarea name="resources" rows="4" class="w-full mt-2 p-3 border rounded-xl"></textarea></label><label>Related Links<textarea name="links" rows="4" class="w-full mt-2 p-3 border rounded-xl"></textarea></label><label>Last Fact-check Date<input name="verified" type="date" class="w-full mt-2 p-3 border rounded-xl"></label><button class="bg-blue-700 text-white px-6 py-3 rounded-xl font-bold">Save Local Draft</button><div id="msg" class="text-sm"></div></form></main><script>const f=document.getElementById('f'),k='umv-admin-guides';const x=JSON.parse(localStorage.getItem(k)||'null');if(x)Object.entries(x).forEach(([a,b])=>{if(f.elements[a])f.elements[a].value=b});f.onsubmit=e=>{e.preventDefault();localStorage.setItem(k,JSON.stringify(Object.fromEntries(new FormData(f))));msg.textContent='✓ Guide draft सुरक्षित है; publish अभी नहीं हुआ।';msg.className='p-3 rounded-xl bg-emerald-50 text-emerald-800'};</script></body></html>
