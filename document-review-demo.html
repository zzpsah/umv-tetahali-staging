<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Document Archive Demo</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:Inter,system-ui,sans-serif}.row:hover{background:#f8fafc}.thumb{width:58px;height:72px;border:1px solid #cbd5e1;border-radius:8px;background:#f1f5f9}.modal{background:rgba(15,23,42,.65)}</style></head><body class="min-h-screen bg-slate-100 text-slate-900"><header class="bg-slate-950 text-white"><div class="mx-auto max-w-7xl px-4 py-5"><div class="text-xs font-black uppercase tracking-widest text-indigo-300">School Document Pipeline</div><h1 class="text-2xl font-black">Document Archive</h1><p class="text-sm text-slate-400">Government letters and school records</p></div></header><main class="mx-auto max-w-7xl px-4 py-6"><section class="mb-5 rounded-3xl border bg-white p-5 shadow-sm"><div class="flex flex-wrap items-end justify-between gap-4"><div><div class="text-xs font-black uppercase tracking-widest text-indigo-600">Archive</div><h2 class="mt-1 text-xl font-black">Government Documents</h2><p class="mt-1 text-sm text-slate-500">Date, originating office, description, preview and PDF download.</p></div><div class="flex flex-wrap gap-2"><input id="search" class="rounded-xl border px-3 py-2 text-sm" placeholder="Search documents…"><select id="office" class="rounded-xl border px-3 py-2 text-sm"><option value="">All offices</option><option>District Education Officer</option><option>Block Education Officer</option><option>BSEB</option></select></div></div></section><section class="overflow-hidden rounded-3xl border bg-white shadow-sm"><div class="overflow-x-auto"><table class="w-full min-w-[1050px] text-left text-sm"><thead class="bg-slate-50 text-xs font-black uppercase tracking-wider text-slate-500"><tr><th class="px-4 py-3">Preview</th><th class="px-4 py-3">Date</th><th class="px-4 py-3">Originating Office</th><th class="px-4 py-3">Description</th><th class="px-4 py-3">Reference</th><th class="px-4 py-3">PDF</th></tr></thead><tbody id="rows" class="divide-y"></tbody></table></div><div id="empty" class="hidden p-10 text-center text-sm text-slate-500">No documents found.</div></section></main><div id="viewer" class="modal fixed inset-0 hidden items-center justify-center p-4"><div class="w-full max-w-3xl rounded-3xl bg-white shadow-2xl"><div class="flex items-center justify-between border-b p-4"><h3 id="viewer-title" class="font-black">PDF Preview</h3><button onclick="closeViewer()" class="rounded-lg border px-3 py-1">Close</button></div><div class="bg-slate-100 p-4"><iframe id="pdf" class="h-[70vh] w-full rounded-xl bg-white" title="PDF preview"></iframe></div></div></div><script>const docs=[{date:'10 Sep 2026',office:'District Education Officer',desc:'Important circular regarding school records, compliance and submission of required information.',ref:'DEO/2026/0910',pdf:'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf'},{date:'08 Sep 2026',office:'Block Education Officer',desc:'Notice concerning secondary school academic and administrative activities.',ref:'BEO/BHR/2026/088',pdf:'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf'},{date:'05 Sep 2026',office:'BSEB',desc:'Board-related notification for secondary examination and registration processes.',ref:'BSEB/SEC/2026/105',pdf:'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf'}];function render(){const q=document.getElementById('search').value.toLowerCase(),o=document.getElementById('office').value,f=docs.filter(d=>(!q||Object.values(d).join(' ').toLowerCase().includes(q))&&(!o||d.office===o));document.getElementById('empty').classList.toggle('hidden',f.length>0);document.getElementById('rows').innerHTML=f.map(d=>{const i=docs.indexOf(d);return `<tr class="row"><td class="px-4 py-3"><button onclick="preview(${i})"><div class="thumb flex items-center justify-center text-[10px] font-black text-slate-500">PDF<br>PREVIEW</div></button></td><td class="whitespace-nowrap px-4 py-3 font-bold">${d.date}</td><td class="px-4 py-3 font-semibold">${d.office}</td><td class="max-w-md px-4 py-3 text-slate-600">${d.desc}</td><td class="whitespace-nowrap px-4 py-3 text-xs font-bold text-slate-500">${d.ref}</td><td class="px-4 py-3"><div class="flex gap-2"><button onclick="preview(${i})" class="rounded-lg border px-3 py-2 text-xs font-black">Preview</button><a href="${d.pdf}" target="_blank" rel="noopener" class="rounded-lg bg-slate-950 px-3 py-2 text-xs font-black text-white">Download PDF ↗</a></div></td></tr>`}).join('')}function preview(i){document.getElementById('viewer-title').textContent=docs[i].ref+' — '+docs[i].office;document.getElementById('pdf').src=docs[i].pdf;document.getElementById('viewer').classList.remove('hidden');document.getElementById('viewer').classList.add('flex')}function closeViewer(){document.getElementById('viewer').classList.add('hidden');document.getElementById('viewer').classList.remove('flex')}document.getElementById('search').addEventListener('input',render);document.getElementById('office').addEventListener('change',render);render();</script></body></html>
